<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html
    DirectoryIndex admin.php index.php
    <Directory /var/www/html>
        Options -Indexes -MultiViews
        AllowOverride FileInfo AuthConfig Options
        Require all granted
    </Directory>
    <FilesMatch "(?i)^(config|panel_import|panel_series_cache|panel_revalidation|panel_security|panel_i18n|db_migrations|migrate|migrate_v2|fix_db|update_db)\.php$">
        Require all denied
    </FilesMatch>
    Alias /__test_provider/player_api.php /opt/gpanel/deploy/fixture-provider.php
    <Directory /opt/gpanel/deploy>
        Require local
    </Directory>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    ErrorLog /proc/self/fd/2
    # No URL/query logging: Xtream URLs can contain client credentials.
    LogFormat "%m %>s %b %D" gpanel_safe
    CustomLog /proc/self/fd/1 gpanel_safe
</VirtualHost>
